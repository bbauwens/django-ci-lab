services:
  app:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: example_password
      POSTGRES_DB: appdb
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    networks:
       - app-network
  
  db:
     image: postgres:16
     environment:
       POSTGRES_USER: appuser
       POSTGRES_PASSWORD: example_password
       POSTGRES_DB: appdb
     volumes:
       - db_data:/var/lib/postgresql/data
     networks:
       - app-network
       
volumes:
  db_data:

networks:
  app-network:
      driver: bridge